<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Chatville — Town</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/overlay.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #102016;
      color: var(--paper);
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    header, footer {
      position: absolute;
      left: 24px;
      right: 24px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      gap: 24px;
    }
    header { top: 18px; }
    footer { bottom: 18px; }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .brand p {
      margin: 0;
      font-size: 10px;
      line-height: 1.6;
      color: #f4e7c3;
    }
    .live {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #fff;
    }
    .dot {
      width: 14px;
      height: 14px;
      background: var(--live);
      box-shadow: 0 0 0 3px #1a0e08;
      animation: blink 1.2s steps(2, jump-none) infinite;
    }
    @keyframes blink { to { opacity: 0.2; } }
    .stats {
      display: flex;
      gap: 18px;
      font-size: 10px;
    }
    .last {
      font-size: 11px;
      max-width: 70%;
      line-height: 1.5;
    }
    .legend {
      display: flex;
      gap: 12px;
      font-size: 8px;
      opacity: 0.9;
    }
    .swatch { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; border: 1px solid #1a0e08; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="town" width="1920" height="1080"></canvas>
    <header class="hud-plaque">
      <div class="brand">
        <h1>CHATVILLE</h1>
        <p>La ville que le chat construit — Pixelcity live</p>
      </div>
      <div class="live"><span class="dot"></span> LIVE</div>
    </header>
    <footer class="hud-plaque">
      <div>
        <div class="last" id="last">En attente des viewers… tapez !build !road !park</div>
        <div class="legend" style="margin-top:10px">
          <span><i class="swatch" style="background:#3e8c32"></i>vide</span>
          <span><i class="swatch" style="background:#3fa84a"></i>arbre</span>
          <span><i class="swatch" style="background:#6d6a6e"></i>route</span>
          <span><i class="swatch" style="background:#6bc25a"></i>parc</span>
          <span><i class="swatch" style="background:#c4452d"></i>maison</span>
          <span><i class="swatch" style="background:#3d7cff"></i>shop</span>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </footer>
    <div class="scanlines"></div>
  </div>
  <script type="module">
    import { connectTownSocket } from "/shared/ws-client.js";
    import { createTownRenderer } from "/shared/town-render.js";

    const canvas = document.getElementById("town");
    const renderer = createTownRenderer(canvas);
    const lastEl = document.getElementById("last");
    const statsEl = document.getElementById("stats");
    let state = null;
    let flashUntil = 0;

    function paint() {
      if (state) renderer.draw(state, { flashUntil });
      requestAnimationFrame(paint);
    }
    paint();

    function renderHud() {
      if (!state) return;
      const s = state.stats;
      statsEl.textContent = `${s.house} maisons  ·  ${s.shop} shops  ·  ${s.road} routes  ·  ${s.tree} arbres`;
      if (state.lastEvent) lastEl.textContent = state.lastEvent.message;
    }

    connectTownSocket((msg) => {
      if (msg.type === "state") {
        state = msg.payload;
        const ev = state.lastEvent;
        if (ev && ev.x != null && ev.y != null) renderer.setHighlight({ x: ev.x, y: ev.y });
        renderHud();
      }
      if (msg.type === "event") {
        lastEl.textContent = msg.payload.message;
        if (msg.payload.x != null) renderer.setHighlight({ x: msg.payload.x, y: msg.payload.y });
      }
      if (msg.type === "flash") {
        flashUntil = performance.now() + 1800;
        lastEl.textContent = `${msg.payload.user} · ${msg.payload.amount} bits`;
      }
    });
  </script>
</body>
</html>
